name: Docs

# Builds the AnalogJS documentation site in `docs/` and publishes it to GitHub
# Pages at https://nntndfrk.github.io/ng-mcp-ui/.
#
# Pull requests build only — a broken docs site fails before merge without
# touching the live site. Pushes to `main` (and manual dispatch) also deploy.
# Both triggers are path-filtered so a library-only change doesn't rebuild the
# site, and a docs-only change doesn't drag the Angular matrix along with it.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions".
# `configure-pages` attempts this via the API, but the repo setting can still
# need flipping by hand.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/README.md"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "docs/**"
      - "**/README.md"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build docs
        # The project site is served from /<repo>/, so the whole app — assets,
        # router base href, and in-content links — is built under that prefix.
        run: npm run docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path || '/ng-mcp-ui' }}/

      - name: Ensure .nojekyll
        # Belt and braces: without it Pages runs the output through Jekyll,
        # which drops any path starting with an underscore.
        run: touch docs/dist/analog/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/analog/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
